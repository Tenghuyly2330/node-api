name: Node API CI/CD

on:
      push:
            branches:
                  - main
      pull_request:
            branches:
                  - main

jobs:
      build:
            runs-on: ubuntu-latest

            steps:
                  - name: Checkout code
                    uses: actions/checkout@v5
                  - name: Set up Node.js
                    uses: actions/setup-node@v6
                    with:
                          node-version: 24
                          cache: "npm"
                  - name: Install dependencies
                    run: npm ci
                  - name: Run tests
                    run: npm test
