name: Node API CI/CD

on:
      push:
            branches:
                  - main
      pull_request:
            branches:
                  - main

jobs:
      build:
            runs-on: ubuntu-latest

            steps:
                  - name: Checkout code
                    uses: actions/checkout@v5
                  - name: Set up Node.js
                    uses: actions/setup-node@v6
                    with:
                          node-version: 24
                          cache: "npm"
                  - name: Install dependencies
                    run: npm ci
                  - name: Run tests
                    run: npm test

      docker-build:
            needs: build
            runs-on: ubuntu-latest

            steps:
                  - name: Checkout source code
                    uses: actions/checkout@v5
                  - name: Login to docker hub
                    uses: docker/login-action@v3
                    with:
                          username: ${{ secrets.DOCKER_USERNAME }}
                          password: ${{ secrets.DOCKER_PASSWORD }}
                  - name: build docker image
                    run: docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/node-api:latest .
                  - name: Push to docker hub
                    run: docker push ${{ secrets.DOCKERHUB_USERNAME }}/node-api:latest

      