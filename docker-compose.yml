services:
  api:
    build: .
    container_name: node-api
    ports:
      - 5000:5000
    environment:
      - PORT= 5000
      - MONGO_URI=mongodb://mongodb:27017/devops_tasks
    depends_on:
      - mongodb

  mongodb: 
    image: mongo:8
    container_name: devops-mongodb
    ports:
      - 27017:27017
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: