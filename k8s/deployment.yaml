apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: node-api
  template:
    metadata:
      labels:
        app: node-api
    spec:
      containers:
      - name: node-api
        image: tenghuy/node-api:v2
        ports:
          - containerPort: 5000
        env:
          - name: PORT
            valueFrom: 
              configMapKeyRef:
                name: node-api-config
                key: PORT 
          - name: MONGO_URI
            valueFrom: 
              secretKeyRef:
                name: node-api-secret
                key: MONGO_URI
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
